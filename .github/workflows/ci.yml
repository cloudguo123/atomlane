name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025]
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python verification dependencies
        run: python -m pip install --disable-pip-version-check ruff==0.16.4 jsonschema==4.25.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install UI build dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify reproducible indicator bundle
        run: |
          npm run build:indicator
          git diff --exit-code -- assets/parallel-indicator-host.bundle.js

      - name: Compile Python sources
        run: python -m compileall -q scripts

      - name: Run regression tests
        run: python -m unittest discover -s scripts -p "test*.py" -v

      - name: Run native Windows containment gates
        if: runner.os == 'Windows'
        run: python -m unittest discover -s scripts -p "test_windows_runtime.py" -v

      - name: Run end-to-end self-test
        run: python scripts/self_test.py

      - name: Run Ruff
        run: ruff check --no-cache scripts

      - name: Generate Windows Preview evidence
        if: matrix.os == 'windows-2025' && matrix.python == '3.13'
        shell: pwsh
        run: |
          python scripts/generate_test_report.py --output windows-report/index.html --json-output windows-report/windows-preview-results.json
          Copy-Item windows-report/windows-preview-results.json windows-report/test-results.json

      - name: Upload Windows Preview evidence
        if: matrix.os == 'windows-2025' && matrix.python == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-preview-evidence-${{ github.sha }}
          path: windows-report
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Require every CI matrix cell
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "CI matrix result: $MATRIX_RESULT"
            exit 1
          fi
