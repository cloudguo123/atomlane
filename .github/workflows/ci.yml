name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install UI build dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify reproducible indicator bundle
        run: |
          npm run build:indicator
          git diff --exit-code -- assets/parallel-indicator-host.bundle.js

      - name: Compile Python sources
        run: python3 -m py_compile scripts/*.py

      - name: Run regression tests
        run: python3 -m unittest discover -s scripts -p 'test*.py' -v

      - name: Run end-to-end self-test
        run: python3 scripts/self_test.py

      - name: Run Ruff
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.16.4
          ruff check --no-cache scripts
