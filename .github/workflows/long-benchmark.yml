name: Five-Minute Benchmark

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Duration of every independent task; must be at least 300 seconds
        required: true
        default: "310"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: long-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: macos-14
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BENCHMARK_DURATION: ${{ inputs.duration_seconds || '310' }}

    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install report dependencies
        run: |
          npm ci --no-audit --no-fund
          python3 -m pip install --disable-pip-version-check ruff==0.16.4

      - name: Run four five-minute workloads in parallel
        run: |
          python3 scripts/long_benchmark.py run \
            --duration-seconds "$BENCHMARK_DURATION" \
            --minimum-task-seconds 300 \
            --output docs/benchmark-results.json

      - name: Regenerate combined dashboard
        run: python3 scripts/generate_test_report.py

      - name: Record benchmark evidence on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmark-results.json docs/index.html docs/test-results.json
          if ! git diff --cached --quiet; then
            git commit -m "test: record five-minute benchmark $GITHUB_RUN_ID"
            git push origin HEAD:main
          fi

      - name: Write run summary
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("docs/benchmark-results.json").read_text())
          latest = result["latest"]
          cumulative = result["cumulative"]
          summary = (
              "## Five-minute benchmark\n\n"
              f"- Status: **{latest['status']}**\n"
              f"- Every task: **≥ {latest['minimum_task_seconds']:.0f}s**\n"
              f"- Parallel wall time: **{latest['parallel']['wall_time_seconds']:.2f}s**\n"
              f"- Serial equivalent: **{latest['serial_equivalent']['seconds']:.2f}s**\n"
              f"- Saved this run: **{latest['savings']['seconds']:.2f}s**\n"
              f"- Speedup: **{latest['savings']['speedup_multiplier']:.2f}×**\n"
              f"- Cumulative saved: **{cumulative['saved_seconds']:.2f}s**\n"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(summary)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload combined report
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

      - name: Deploy combined report
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
