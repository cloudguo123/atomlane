name: Five-Minute Benchmark

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Duration of every independent task; must be at least 300 seconds
        required: true
        default: "310"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read

concurrency:
  group: long-benchmark-macos
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      BENCHMARK_DURATION: ${{ inputs.duration_seconds || '310' }}

    steps:
      - name: Check out triggering SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Restore prior macOS benchmark history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          candidate_rows=$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow long-benchmark.yml \
              --branch main \
              --status success \
              --limit 20 \
              --json databaseId,headSha \
              --jq '.[] | [.databaseId, .headSha] | @tsv'
          )
          while IFS=$'\t' read -r candidate_run candidate_sha; do
            if [[ -n "$candidate_run" && -n "$candidate_sha" ]] &&
              git merge-base --is-ancestor "$candidate_sha" HEAD; then
              if gh run download "$candidate_run" \
                --repo "$GITHUB_REPOSITORY" \
                --name "macos-five-minute-benchmark-$candidate_sha" \
                --dir artifacts; then
                test -f artifacts/benchmark-results.json
                break
              fi
            fi
          done <<< "$candidate_rows"
          if [[ ! -f artifacts/benchmark-results.json && -f docs/benchmark-results.json ]]; then
            cp docs/benchmark-results.json artifacts/benchmark-results.json
            echo "Bootstrapped retained macOS history from the reviewed repository evidence."
          fi

      - name: Run four five-minute workloads in parallel
        run: |
          python3 scripts/long_benchmark.py run \
            --duration-seconds "$BENCHMARK_DURATION" \
            --minimum-task-seconds 300 \
            --output artifacts/benchmark-results.json

      - name: Write run summary
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path("artifacts/benchmark-results.json").read_text())
          latest = result["latest"]
          cumulative = result["cumulative"]
          summary = (
              "## Five-minute benchmark\n\n"
              f"- Status: **{latest['status']}**\n"
              f"- Observed shortest task: **{latest['observed_minimum_task_seconds']:.2f}s**\n"
              f"- Required minimum: **{latest['minimum_task_seconds']:.0f}s**\n"
              f"- Parallel wall time: **{latest['parallel']['wall_time_seconds']:.2f}s**\n"
              f"- Serial equivalent: **{latest['serial_equivalent']['seconds']:.2f}s**\n"
              f"- Saved this run: **{latest['savings']['seconds']:.2f}s**\n"
              f"- Speedup: **{latest['savings']['speedup_multiplier']:.2f}×**\n"
              f"- Cumulative saved: **{cumulative['saved_seconds']:.2f}s**\n"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(summary)
          PY

      - name: Upload native macOS benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-five-minute-benchmark-${{ github.sha }}
          path: artifacts/benchmark-results.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
