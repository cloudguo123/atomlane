name: Public Growth Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "43 2 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: public-growth-metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Collect aggregate GitHub metrics
        env:
          GITHUB_TOKEN: ${{ secrets.MPA_TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/collect_github_metrics.py

      - name: Propose weekly snapshot through a protected-branch PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="automation/public-growth-metrics"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: record weekly public growth metrics"
            remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
            if [ -n "$remote_sha" ]; then
              git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"
            else
              git push origin "HEAD:refs/heads/$branch"
            fi
            if ! gh pr list --base main --head "$branch" --state open --json number --jq 'length > 0' | grep -qx true; then
              gh pr create \
                --base main \
                --head "$branch" \
                --title "docs: record weekly public growth metrics" \
                --body "Automated aggregate GitHub metrics snapshot."
            fi
          fi
